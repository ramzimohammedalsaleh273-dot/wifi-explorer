name: Build Windows Desktop
on:
  push:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows runner project
        shell: pwsh
        run: |
          $template = Join-Path $env:TEMP "wifi-template"
          flutter create --platforms=windows --org=com.example --project-name=wifi_explorer $template
          New-Item -ItemType Directory -Force .\windows | Out-Null
          Copy-Item -Path (Join-Path $template "windows\*") -Destination .\windows -Recurse -Force
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze source
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build Windows app
        run: flutter build windows --release
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: wifi-explorer-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
